<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotización</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Página de Cotización</h1>
        <nav>
            <a href="index.html">Inicio</a>
        </nav>
    </header>

    <section class="cotizacion">
        <h2>Calcula tu compra</h2>

        <label>Laptop HP:</label>
        <input type="number" id="laptop" min="0" value="0">

        <label>Router WiFi:</label>
        <input type="number" id="router" min="0" value="0">

        <label>Memoria USB:</label>
        <input type="number" id="usb" min="0" value="0">

        <label>Disco SSD:</label>
        <input type="number" id="ssd" min="0" value="0">

        <label>Cámara Web HD:</label>
        <input type="number" id="camara" min="0" value="0">

        <button onclick="calcularTotal()">Calcular Total</button>

        <h3 id="resultado">Total: $0 MXN</h3>
    </section>

    <script src="script.js"></script>
</body>
</html>
